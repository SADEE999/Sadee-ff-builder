
name: SADEE X DIMA - Build APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project ZIP
        shell: bash
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Repair Known Kotlin Source Formatting
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "admin-app/src/main/java/com/sadeexdima/admin/MainActivity.kt"
          s = p.read_text()

          s = s.replace(
              ' }\\n    var maxDevices',
              ' }\n    var maxDevices'
          )
          s = s.replace(
              'fontSize = 18.sp)\\n                        Text("Choose',
              'fontSize = 18.sp)\n                        Text("Choose'
          )

          p.write_text(s)
          print("Kotlin formatting check completed.")
          PY

      - name: Build Optimizer APK
        run: |
          gradle -p "$PROJECT_DIR" \
            :optimizer-app:assembleDebug \
            --no-daemon --stacktrace

      - name: Build Admin APK
        run: |
          gradle -p "$PROJECT_DIR" \
            :admin-app:assembleDebug \
            --no-daemon --stacktrace

      - name: Upload Optimizer APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER
          path: ${{ env.PROJECT_DIR }}/optimizer-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-ADMIN
          path: ${{ env.PROJECT_DIR }}/admin-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
