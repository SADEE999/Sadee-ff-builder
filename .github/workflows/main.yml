
name: SADEE EDITOR PRO APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate ZIP
        shell: bash
        run: |
          ZIP_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_PATH" ]; then
            echo "No project ZIP found!"
            exit 1
          fi

          echo "ZIP found: $ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Extract Project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sadee"

          unzip -oq "$ZIP_PATH" -d "$RUNNER_TEMP/sadee"

          PROJECT_DIR="$(find "$RUNNER_TEMP/sadee" -type f -name package.json -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project located: $PROJECT_DIR"

      - name: Android SDK Setup
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Create Android Project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Capacitor Sync
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="$(find "$PROJECT_DIR/android/app/build/outputs/apk/debug" -name '*.apk' -type f | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/final_apk"
          cp "$APK" "$RUNNER_TEMP/final_apk/SADEE-EDITOR-PRO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-EDITOR-PRO-APK
          path: ${{ runner.temp }}/final_apk/SADEE-EDITOR-PRO.apk
          if-no-files-found: error
          retention-days: 7
