
name: SADEE GAMING POSTER PRO - APK BUILDER

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Project ZIP
        shell: bash
        run: |
          ZIP_PATH="$(find "$GITHUB_WORKSPACE" \
            -type f -iname '*.zip' \
            -not -path '*/.git/*' -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_PATH"

          mkdir -p /tmp/sadee_project
          unzip -o "$ZIP_PATH" -d /tmp/sadee_project

          SETTINGS_FILE="$(find /tmp/sadee_project \
            -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project extracted successfully!"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Check APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" \
            -name '*.apk' -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-GAMING-POSTER-PRO-APK
          path: /tmp/sadee_project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
