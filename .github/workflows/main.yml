
name: SADEE X DIMA V2 - ZIP Extract & Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found!"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -o "${{ steps.source.outputs.zip }}" -d extracted
          ls -la extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android Project
        shell: bash
        run: |
          set -euo pipefail

          test -f extracted/settings.gradle
          test -d extracted/optimizer-app
          test -d extracted/admin-app

          echo "Project structure verified"

      - name: Build Both APKs
        working-directory: extracted
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Prepare APK Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          OPTIMIZER=$(find extracted/optimizer-app/build/outputs/apk \
            -type f -name '*.apk' -print -quit)

          ADMIN=$(find extracted/admin-app/build/outputs/apk \
            -type f -name '*.apk' -print -quit)

          test -n "$OPTIMIZER"
          test -n "$ADMIN"

          cp "$OPTIMIZER" release/SADEE_X_DIMA_OPTIMIZER_V2.apk
          cp "$ADMIN" release/SADEE_X_DIMA_ADMIN_V2.apk

          ls -lh release/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V2-APKs
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
