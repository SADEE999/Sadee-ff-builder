
name: Build SADEE EDITOR PRO APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and extract ZIP
        run: |
          ZIP_PATH="$(find "$GITHUB_WORKSPACE" -name '*.zip' -type f | head -n 1)"

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_PATH"

          mkdir -p /tmp/sadee_project
          unzip -o "$ZIP_PATH" -d /tmp/sadee_project

          PROJECT_DIR="$(find /tmp/sadee_project -name package.json -type f | head -n 1 | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install
        working-directory: /tmp/sadee_project/sadee_apk_ready

      - name: Generate Android project
        run: npx cap add android
        working-directory: /tmp/sadee_project/sadee_apk_ready

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: /tmp/sadee_project/sadee_apk_ready

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: /tmp/sadee_project/sadee_apk_ready

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-EDITOR-PRO-APK
          path: /tmp/sadee_project/sadee_apk_ready/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
