name: SADEE X DIMA - Build Both APKs
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded project ZIP (if present)
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted
            ROOT="$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)"
            test -n "$ROOT" || { echo "settings.gradle(.kts) not found in ZIP"; exit 1; }
            echo "PROJECT_DIR=$(dirname "$ROOT")" >> "$GITHUB_ENV"
          else
            test -f settings.gradle.kts || test -f settings.gradle
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Optimizer APK
        run: gradle -p "$PROJECT_DIR" :optimizer-app:assembleDebug
      - name: Build Admin APK
        run: gradle -p "$PROJECT_DIR" :admin-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-OPTIMIZER
          path: ${{ env.PROJECT_DIR }}/optimizer-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-ADMIN
          path: ${{ env.PROJECT_DIR }}/admin-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
