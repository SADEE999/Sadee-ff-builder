
name: SADEE X DIMA V2 - ZIP Extract & Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Source ZIP
        id: source
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found!"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.source.outputs.zip }}" -d extracted

          echo "ZIP Extracted Successfully"
          ls -la extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android Project
        run: |
          test -f extracted/settings.gradle
          test -d extracted/optimizer-app
          test -d extracted/admin-app
          echo "Project structure verified"

      - name: Build Both APKs
        working-directory: extracted
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Prepare APK Files
        run: |
          mkdir -p release

          cp extracted/optimizer-app/build/outputs/apk/debug/*.apk \
            release/SADEE_X_DIMA_OPTIMIZER_V2.apk

          cp extracted/admin-app/build/outputs/apk/debug/*.apk \
            release/SADEE_X_DIMA_ADMIN_V2.apk

          ls -lh release/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-V2-APKs
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
